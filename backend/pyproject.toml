[project]
name = "coronary-wall-workbench-backend"
version = "0.4.0"
description = "Backend and geometry engine for CoronaryWallWorkbench"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116",
  "uvicorn[standard]>=0.35",
  "numpy>=2.0",
  "scipy>=1.14",
  "SimpleITK>=2.4",
  "pydantic>=2.11",
  "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "httpx>=0.28",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
